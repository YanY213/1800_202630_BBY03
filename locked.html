
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked Time Capsules</title>
</head>

<body>

    <!-- Page Title -->
    <h1>Locked Time Capsules</h1>
    <p>Your locked time capsules are displayed below.</p>

    <!-- Locked Time Capsule List -->
    <div id="locked-capsule-list">

        <!-- First Capsule -->
        <div class="capsule-card">
            <h3>My First Time Capsule</h3>
            <p>Status: Locked</p>

            <button type="button" disabled>
                Open Capsule
            </button>

            <button type="button" class="delete-btn">
                Delete
            </button>
        </div>

        <hr>

        <!-- Second Capsule -->
        <div class="capsule-card">
            <h3>My Second Time Capsule</h3>
            <p>Status: Locked</p>

            <button type="button" disabled>
                Open Capsule
            </button>

            <button type="button" class="delete-btn">
                Delete
            </button>
        </div>

    </div>

    <!-- Empty Message -->
    <div id="empty-message" hidden>
        <h3>No Time Capsules Yet</h3>
        <p>Your locked time capsules will appear here.</p>
    </div>

</body>
</html>
