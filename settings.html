<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Time Capsule</title>
</head>
<body>
    <!-- Navigation Bar from James -->
<nav class="navbar fixed-bottom bg-light border-top">
  <div class="container-fluid justify-content-around">

    <a class="nav-link text-center active" aria-current="page" href="index.html">
      <i class="bi bi-house d-block fs-5"></i>

    <!-- Settings Page -->
<div class="container py-4 pb-5">

    <h1>Settings</h1>
    <p>Manage your Time Capsule settings here.</p>

    <!-- Account Section -->
    <div class="card mt-4">
        <div class="card-body">

            <h3 class="card-title">Account</h3>
            <p class="text-muted">Manage your personal information.</p>

            <div class="mb-3">
                <label for="displayName" class="form-label">
                    Display Name
                </label>
                <input type="text" class="form-control"
                       id="displayName" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>
                <input type="email" class="form-control"
                       id="email" placeholder="Enter your email">
            </div>

            <button type="button" class="btn btn-primary">
                Save Changes
            </button>

        </div>
    </div>

</div>
<!-- Password Settings -->
<hr class="my-4">

<h4>Password Settings</h4>
<p class="text-muted">
    Manage your account password.
</p>

<!-- Change Password -->
<div class="mb-3">
    <label for="currentPassword" class="form-label">
        Current Password
    </label>
    <input type="password" class="form-control"
           id="currentPassword"
           placeholder="Enter current password">
</div>

<div class="mb-3">
    <label for="newPassword" class="form-label">
        New Password
    </label>
    <input type="password" class="form-control"
           id="newPassword"
           placeholder="Enter new password">
</div>

<div class="mb-3">
    <label for="confirmPassword" class="form-label">
        Confirm New Password
    </label>
    <input type="password" class="form-control"
           id="confirmPassword"
           placeholder="Confirm new password">
</div>

<button type="button" class="btn btn-primary">
    Change Password
</button>

<!-- Forgot Password -->
<div class="mt-3">
    <a href="#" class="text-decoration-none">
        Forgot Password?
    </a>
</div>
