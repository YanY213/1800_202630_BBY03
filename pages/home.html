<!doctype html>
<html lang="en">
  <head>
    <title>Time Capsule App</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <site-navbar></site-navbar>
    <!-- Main content goes here -->
    <div class="container py-4">
      <!-- Homepage Title -->
      <h1>My Time Capsules</h1>
      <p>Explore your saved memories!</p>

      <!-- Search Bar -->
      <input
        type="search"
        class="form-control"
        id="searchbar"
        placeholder="Search your time capsules..."
      />

      <!-- Time Capsule Cards -->
      <div id="capsule-list">
        <!-- Time capsule cards will appear here -->

        <!-- Empty List Message -->
        <div class="card mt-4">
          <div class="card-body">
            <h3 class="card-title">No Time Capsules Yet</h3>
            <p class="text-muted">Your saved time capsules will appear here.</p>
          </div>
        </div>
      </div>

      <!---------------------------------------------->
      <!-- Your own JavaScript functions go here    -->
      <!---------------------------------------------->
      <!-- Link to scripts of your own -->
      <script type="module" src="/src/scripts/home.js"></script>
    </div>
  </body>
</html>
