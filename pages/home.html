<!doctype html>
<html lang="en">

<head>
  <title>Time Capsule App</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Web Components -->
  <script type="module" src="/src/components/site-navbar.js"></script>
</head>

<body>

  <site-navbar></site-navbar>

  <!-- Main Content -->
  <div class="container py-4">

    <!-- Homepage Title -->
    <h1>My Time Capsules</h1>
    <p>Explore your saved memories!</p>

    <!-- Search Bar -->
    <input
      type="search"
      class="form-control"
      id="searchbar"
      placeholder="Search your time capsules..."
    />

    <!-- Time Capsule Cards -->
    <div id="capsule-list">
      <!-- Time capsule cards will appear here -->

      <!-- Reference: Original Locked Capsule Card -->
      <template id="locked-capsule-reference">

          <!-- Locked Capsule Card -->
          <div class="card bg-light mb-3 capsuleCard">

              <div class="card-body">

                  <!-- Clickable Capsule Content -->
                  <div
                      role="button"
                      tabindex="0"
                      data-bs-toggle="modal"
                      data-bs-target="#lockedModal"
                  >

                      <div class="d-flex align-items-center gap-3 mb-3">

                          <!-- Lock Icon -->
                          <div class="border border-dark rounded p-3">
                              <i class="bi bi-lock-fill fs-2"></i>
                          </div>

                          <!-- Capsule Information -->
                          <div>
                              <h4 class="fw-bold mb-0">Road Trip</h4>
                              <small class="fw-bold">18 memories inside</small>
                          </div>

                      </div>

                      <!-- Countdown Box -->
                      <div class="border border-dark rounded p-3">

                          <h5 class="fw-bold mb-0">Opens in</h5>

                          <p class="fw-bold mb-2">24 Days 6 Hours</p>

                          <!-- Progress Bar -->
                          <div class="progress mb-2">
                              <div
                                  class="progress-bar bg-secondary"
                                  style="width: 70%"
                              ></div>
                          </div>

                          <small class="fw-bold">
                              Created Aug 12 • Opens Nov 14
                          </small>

                      </div>

                  </div>
                  <!-- End Clickable Capsule Content -->

                  <!-- Delete Capsule Button -->
                  <button
                      type="button"
                      class="btn btn-danger mt-3 delete-btn"
                  >
                      <i class="bi bi-trash"></i> Delete
                  </button>

              </div>
          </div>

      </template>









      

    </div>
    <!-- End Capsule List -->

    <!-- Empty List Message -->
    <div class="card mt-4" id="empty-message" hidden>
      <div class="card-body">
        <h3 class="card-title">No Time Capsules Yet</h3>
        <p class="text-muted">
          Your saved time capsules will appear here.
        </p>
      </div>
    </div>

  </div>
  <!-- End Main Content -->

  <!-- Locked Capsule Popup -->
  <div
    class="modal fade"
    id="lockedModal"
    tabindex="-1"
    aria-labelledby="lockedModalLabel"
    aria-hidden="true"
  >

    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <!-- Popup Header -->
        <div class="modal-header">

          <h5 class="modal-title" id="lockedModalLabel">
            Road Trip
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>

        </div>

        <!-- Popup Body -->
        <div class="modal-body text-center">

          <i class="bi bi-lock-fill fs-1"></i>

          <h5 class="mt-3">This Capsule Is Locked</h5>

          <p>
            Your memories will be available when this capsule unlocks.
          </p>

          <p class="fw-bold">
            Opens November 14, 2026
          </p>

        </div>

        <!-- Popup Footer -->
        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Close
          </button>

        </div>

      </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script type="module" src="/src/scripts/home.js"></script>
  <script type="module" src="/src/main.js"></script>

  <!-- Keyboard and Delete Button Support -->
  <script>
    const capsuleCard = document.querySelector(
      "[data-bs-target='#lockedModal']"
    );

    // Open locked popup using Enter or Space
    if (capsuleCard) {
      capsuleCard.addEventListener("keydown", function (event) {
        if (event.target !== capsuleCard) {
          return;
        }

        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          capsuleCard.click();
        }
      });
    }

    // Delete capsule from homepage
    const deleteButton = document.querySelector(".delete-btn");

    if (deleteButton) {
      deleteButton.addEventListener("click", function (event) {
        event.stopPropagation();

        // Find the capsule card and remove it
        const capsule = deleteButton.closest(".capsuleCard");

        if (capsule) {
          capsule.remove();
        }

        // Show empty message if no capsules remain
        const capsuleList = document.querySelector("#capsule-list");
        const emptyMessage = document.querySelector("#empty-message");

        if (
          capsuleList &&
          emptyMessage &&
          !capsuleList.querySelector(".capsuleCard")
        ) {
          emptyMessage.hidden = false;
        }
      });
    }
  </script>

</body>
</html>
