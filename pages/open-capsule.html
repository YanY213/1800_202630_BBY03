
<!doctype html>
<html lang="en">

<head>
  <title>Opened Capsule | Time Capsule App</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Website FavIcon -->
  <link rel="icon" type="image/png" href="/images/favicon.png">

  <!-- Web Components -->
  <script type="module" src="/src/components/site-navbar.js"></script>

  <!-- Masonry Gallery CSS -->
  <style>
    .image-gallery {
      columns: 3 200px;
      column-gap: 15px;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 15px;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>

</head>

<body>

  <site-navbar></site-navbar>

  <!-- Main Content -->
  <div class="container pt-4 pb-5 mb-4">

    <!-- Back Button -->
    <a href="/pages/home.html" class="btn btn-outline-secondary mb-3">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <!-- Capsule Heading -->
    <div class="text-center mb-4">

      <h1 id="capsule-title">Your Time Capsule</h1>

      <p>Your memories are finally unlocked!</p>

      <p class="text-muted">
        Created: <span id="created-date">Date</span>
      </p>

      <p class="text-muted">
        Unlocked: <span id="unlock-date">Date</span>
      </p>

    </div>

    <!-- Capsule Message -->
    <div class="text-center mb-4">
      <p id="capsule-message" class="fs-4"></p>
    </div>

    <!-- Capsule Images -->
    <div class="card mb-4">

      <div class="card-body">

        <!-- Masonry Image Gallery -->
        <div id="capsule-images" class="image-gallery">

          <!-- Saved images will appear here -->

        </div>

      </div>

    </div>

    <!-- Image Template -->
    <template id="image-template">

      <div class="gallery-item">

        <img
          class="img-fluid rounded"
          alt="Saved capsule memory"
        />

      </div>

    </template>

  </div>
  <!-- End Main Content -->

  <!-- JavaScript Files -->
  <script type="module" src="/src/scripts/open-capsule.js"></script>
  <script type="module" src="/src/main.js"></script>

</body>
</html>
