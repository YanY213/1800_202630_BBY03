<!doctype html>
<html lang="en">
  <head>
    <title>Time Capsule App</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="../src/components/site-navbar.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <site-navbar></site-navbar>
    <!-- Main content goes here -->
    <div class="overflow-scroll" style="margin-bottom: 100px">
      <div class="container py-4">
        <h1>Settings</h1>
        <p>Manage your Time Capsule settings here.</p>

        <!-- Account Section -->
        <div class="card">
          <div class="card-body">
            <h3 class="card-title">Account</h3>
            <p class="text-muted">Manage your personal information.</p>

            <div class="mb-3">
              <label for="displayName" class="form-label"> Display Name </label>
              <input
                type="text"
                class="form-control"
                id="displayName"
                placeholder="Enter your name"
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label"> Email Address </label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
              />
            </div>

            <button type="button" class="btn btn-primary">Save Changes</button>
          </div>
        </div>
      </div>

      <div class="container mb-100">
        <!-- Password Settings -->
        <hr class="my-4" />

        <h4>Password Settings</h4>
        <p class="text-muted">Manage your account password.</p>

        <!-- Change Password -->

        <div class="mb-3">
          <label for="currentPassword" class="form-label">
            Current Password
          </label>
          <input
            type="password"
            class="form-control"
            id="currentPassword"
            placeholder="Enter current password"
          />
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label"> New Password </label>
          <input
            type="password"
            class="form-control"
            id="newPassword"
            placeholder="Enter new password"
          />
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">
            Confirm New Password
          </label>
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            placeholder="Confirm new password"
          />
        </div>

        <button type="button" class="btn btn-primary">Change Password</button>

        <!-- Forgot Password -->
        <div class="mt-3">
          <a href="#" class="text-decoration-none"> Forgot Password? </a>
        </div>
      </div>

      <!-- Log out button -->
      <div class="d-flex flex-column align-items-center">
        <button type="button" id="signoutButton" class="btn btn-primary w-25">
          Log out
        </button>
      </div>
    </div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->
    <!-- Link to scripts of your own -->
    <script type="module" src="/src/logout.js"></script>
  </body>
</html>
