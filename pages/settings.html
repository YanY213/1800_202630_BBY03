<!doctype html>
<html lang="en">
  <head>
    <title>Time Capsule App</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <site-navbar></site-navbar>
    <!-- Main content goes here -->
    <div class="overflow-scroll" style="margin-bottom: 100px">
      <div class="container py-4">
        <h1>Settings</h1>
        <p>Manage your Time Capsule settings here.</p>

        <!-- Account Section -->
        <div class="card">
          <div class="card-body">
            <h3 class="card-title">Account</h3>
            <p class="text-muted">Manage your personal information.</p>

            <!-- Alert Box -->
            <div
              id="profileAlert"
              class="alert alert-success d-none"
              role="alert"
            ></div>

            <form id="profileForm" novalidate>
              <!-- Display Name -->
              <div class="mb-3">
                <label for="nameInput" class="form-label">Name</label>
                <input
                  type="text"
                  id="nameInput"
                  class="form-control"
                  disabled
                />
              </div>

              <!-- About Me -->
              <div class="mb-3">
                <label for="bioInput" class="form-label">About me</label>
                <textarea
                  id="bioInput"
                  class="form-control"
                  rows="3"
                  disabled
                ></textarea>
              </div>

              <button
                type="button"
                id="editBtnProfile"
                class="btn btn-outline-secondary"
              >
                <i class="bi bi-pencil me-1"></i>Edit
              </button>

              <button
                type="button"
                id="cancelBtnProfile"
                class="btn btn-outline-secondary"
                hidden
              >
                <i class="bi bi-x-lg me-1"></i>Cancel
              </button>

              <button
                type="submit"
                id="saveBtnProfile"
                class="btn btn-primary"
                hidden
              >
                <i class="bi bi-check-lg me-1"></i>Save Changes
              </button>
            </form>
          </div>
        </div>

        <hr class="my-4" />

        <!-- Password Section -->
        <div class="card mt-4">
          <div class="card-body">
            <h3 class="card-title">Password</h3>
            <p class="text-muted">Manage your account password.</p>

            <!-- Alert Box -->
            <div
              id="passwordAlert"
              class="alert alert-success d-none"
              role="alert"
            ></div>

            <form id="passwordForm" novalidate>
              <!-- Current Password -->
              <div class="mb-3" id="currentPasswordDiv" hidden>
                <label for="currentPasswordInput" class="form-label"
                  >Current Password</label
                >
                <input
                  type="password"
                  id="currentPasswordInput"
                  class="form-control"
                />
              </div>

              <!-- New Password -->
              <div class="mb-3" id="newPasswordDiv" hidden>
                <label for="newPasswordInput" class="form-label"
                  >New Password</label
                >
                <input
                  type="password"
                  id="newPasswordInput"
                  class="form-control"
                />
              </div>

              <!-- Confirm New Password -->
              <div class="mb-3" id="confirmPasswordDiv" hidden>
                <label for="confirmPasswordInput" class="form-label">
                  Confirm New Password
                </label>
                <input
                  type="password"
                  id="confirmPasswordInput"
                  class="form-control"
                />
              </div>

              <button
                type="button"
                id="editBtnPassword"
                class="btn btn-outline-secondary"
              >
                <i class="bi bi-pencil me-1"></i>Edit
              </button>

              <button
                type="button"
                id="cancelBtnPassword"
                class="btn btn-outline-secondary"
                hidden
              >
                <i class="bi bi-x-lg me-1"></i>Cancel
              </button>

              <button
                type="submit"
                id="saveBtnPassword"
                class="btn btn-primary"
                hidden
              >
                <i class="bi bi-check-lg me-1"></i>Change Password
              </button>
            </form>

            <!-- Forgot Password -->
            <div class="mt-3">
              <a href="" class="text-decoration-none"> Forgot Password? </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Log out button -->
      <div class="d-flex flex-column align-items-center">
        <button type="button" id="signoutButton" class="btn btn-primary w-25">
          Log out
        </button>
      </div>
    </div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->
    <!-- Link to scripts of your own -->
    <script type="module" src="/src/scripts/settings.js"></script>
  </body>
</html>
