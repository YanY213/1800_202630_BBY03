<!doctype html>
<html lang="en">
  <head>
    <title>Time Capsule App</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Other libraries go here -->
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Website FavIcon-->
    <link rel="icon" type="image/png" href="/images/favicon.png">

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <site-navbar></site-navbar>
    <!-- Main content goes here -->
    <div class="overflow-scroll" style="margin-bottom: 100px">
      <div class="container py-4">
        <h1>Create</h1>
        <p>Make your Time Capsule here.</p>

        <!-- Title Input -->
        <form id="createCapsuleForm" novalidate>
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Enter a Title:</label
            >
            <input
              type="text"
              class="form-control"
              id="titleInput"
              placeholder="My Time Capsule"
            />
          </div>

          <!-- Message Input -->
          <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label"
              >Write a Message:</label
            >
            <textarea
              class="form-control"
              id="messageInput"
              rows="5"
              style="resize: none; width: 100%"
            ></textarea>
          </div>

          <!-- File Selection -->
          <div class="mb-3">
            <label for="formFile" class="form-label">Add Image:</label>
            <input
              class="form-control"
              type="file"
              id="fileInput"
              accept="image/*"
            />

            <!-- Image Preview -->
            <div class="my-3" id="imagePreview" hidden>
              <label for="formFile" class="form-label">Image Preview:</label>

              <div id="carouselExampleIndicators" class="carousel slide">
                <!-- Indicators -->
                <div
                  class="carousel-indicators bg-dark opacity-50 rounded"
                  id="carousel-indicators"
                ></div>

                <!-- Images -->
                <div class="carousel-inner" id="carousel-inner"></div>

                <!-- Previous Button -->
                <button
                  class="carousel-control-prev p-10"
                  type="button"
                  data-bs-target="#carouselExampleIndicators"
                  data-bs-slide="prev"
                >
                  <span
                    class="carousel-control-prev-icon bg-dark rounded-3"
                    aria-hidden="true"
                  ></span>
                </button>

                <!-- Next Button -->
                <button
                  class="carousel-control-next"
                  type="button"
                  data-bs-target="#carouselExampleIndicators"
                  data-bs-slide="next"
                >
                  <span
                    class="carousel-control-next-icon bg-dark rounded-3"
                    aria-hidden="true"
                  ></span>
                </button>
              </div>

              <div class="my-3">
                <button type="button" class="btn btn-danger" id="removeImgBtn">
                  Remove Current Image
                </button>
              </div>
            </div>
          </div>

          <!-- Select Date -->
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Opening Date:</label
            >
            <input type="date" class="form-control" id="openingDateInput" />
          </div>

          <!-- Hide Capsule Button -->
          <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label"
              >Hide Time Capsule:
              <i
                class="bi bi-question-circle"
                data-bs-toggle="tooltip"
                data-bs-placement="top"
                title="Checking this means your time capsule won't be visible, even within your collection, until its unlock time has passed."
              ></i>
            </label>

            <div>
              <input
                class="form-check-input"
                type="checkbox"
                id="hiddenCheckBox"
              />
              <label class="form-check-label" for="checkDefault">
                Hidden
              </label>
            </div>
          </div>

          <!-- Create Button -->
          <div class="d-flex flex-column align-items-center">
            <button type="submit" class="btn btn-primary w-25">Create</button>
          </div>
        </form>
      </div>
    </div>

    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->
    <!-- Link to scripts of your own -->
    <script type="module" src="/src/scripts/create.js"></script>
  </body>
</html>
